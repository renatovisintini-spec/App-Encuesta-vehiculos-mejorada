<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Encuesta sobre vehículos</title><link rel="stylesheet" href="css/normalize.css"><link rel="stylesheet" href="css/styles.css"></head>
<body class="auth-page"><header class="site-header"><div class="container nav"><a class="brand" href="index.html">Encuesta sobre vehículos</a><nav class="nav-links"><a href="index.html">Inicio</a><a href="registro.html">Registrarse</a></nav></div></header>
<main class="auth-wrap"><section class="auth-card"><h1>Iniciar sesión</h1><p>Accede para participar en las encuestas.</p><form data-auth-form data-mode="login" novalidate><div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Contraseña</label><div class="password-row"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="icon-btn" data-toggle-password aria-label="Mostrar contraseña"><img src="Imgs/Ojo-cerrado.jpg" alt=""></button></div></div><p data-form-message class="form-message" aria-live="polite"></p><button class="btn btn-primary" type="submit">Entrar</button></form></section></main><script type="module" src="js/auth.js"></script></body></html>
