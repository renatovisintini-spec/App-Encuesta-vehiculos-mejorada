<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro · Encuesta sobre vehículos</title><link rel="stylesheet" href="css/normalize.css"><link rel="stylesheet" href="css/styles.css"></head>
<body class="auth-page"><header class="site-header"><div class="container nav"><a class="brand" href="index.html">Encuesta sobre vehículos</a><nav class="nav-links"><a href="index.html">Inicio</a><a href="login.html">Login</a></nav></div></header>
<main class="auth-wrap"><section class="auth-card"><h1>Crear cuenta</h1><form data-auth-form data-mode="register" novalidate><div class="field"><label for="nombre">Nombre de usuario</label><input id="nombre" name="nombre" required></div><div class="field"><label for="ciudad">Ciudad</label><input id="ciudad" name="ciudad" required></div><div class="field"><label for="pais">País</label><input id="pais" name="pais" required></div><div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Contraseña</label><div class="password-row"><input id="password" name="password" type="password" autocomplete="new-password" required><button type="button" class="icon-btn" data-toggle-password aria-label="Mostrar contraseña"><img src="Imgs/Ojo-cerrado.jpg" alt=""></button></div></div><div class="field"><label for="repassword">Repetir contraseña</label><div class="password-row"><input id="repassword" name="repassword" type="password" autocomplete="new-password" required><button type="button" class="icon-btn" data-toggle-repassword aria-label="Mostrar contraseña"><img src="Imgs/Ojo-cerrado.jpg" alt=""></button></div></div><p data-form-message class="form-message" aria-live="polite"></p><button class="btn btn-primary" type="submit">Registrar</button></form></section></main><script type="module" src="js/auth.js"></script></body></html>
